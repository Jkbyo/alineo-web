# Configuración de Nixpacks para Coolify
#
# IMPORTANTE: la configuración de producción NO sale de un fichero .env.
# Hay que definir estas variables de entorno en Coolify:
#   APP_NAME=Alineo
#   APP_ENV=production
#   APP_DEBUG=false
#   APP_KEY=base64:...        (generar una sola vez con `php artisan key:generate --show`)
#   APP_URL=https://tu-dominio
#   APP_LOCALE=es
#   LOG_LEVEL=warning
#   SESSION_DRIVER=file
#   CACHE_STORE=file
#   QUEUE_CONNECTION=sync

[phases.setup]
nixPkgs = [
    '(php.withExtensions (pe: pe.enabled ++ []))',
    'libmysqlclient',
    'phpPackages.composer',
    'nodejs_20',
    'npm-9_x'
]
nixLibs = ['libmysqlclient']
nixOverlays = ['https://github.com/railwayapp/nix-npm-overlay/archive/main.tar.gz']
nixpkgsArchive = 'e24b4c09e963677b1beea49d411cd315a024ad3a'
aptPkgs = ["curl", "wget"]

[phases.install]
cmds = [
    "composer install --no-dev --optimize-autoloader --no-interaction",
    "npm install"
]

[phases.build]
# Las cachés de rutas y vistas no dependen de variables de entorno,
# así que se pueden generar en el build.
cmds = [
    "npm run build",
    "php artisan route:cache",
    "php artisan view:cache",
    "chmod -R 775 /app/storage /app/bootstrap/cache"
]

[start]
# config:cache se ejecuta al arrancar para que use las variables de Coolify.
cmd = "php artisan config:cache && php artisan serve --host=0.0.0.0 --port=8000"
